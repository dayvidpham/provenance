  - name: duplicate-context-field
    classification: must-fail
    provenance: {source: boundary, ref: "DBOS context has six fields"}
    mutation: {description: "A trailing duplicate context field fails closed.", operator: duplicate-context-field}
    input:
      schema: provenance.dbos-apply-input
      contextHex: 0000001770726f76656e616e63652e64626f732d636f6e7465787400000011666978747572652d6f7065726174696f6e0000002d666978747572652d2d30313866303030302d303030302d373030302d383030302d303030303030303030303032000000090100000000000000070000000f666978747572652d636f6d6d616e640000000800000000000000630000000100
      mutation: &validMutation "version:22:provenance.mutation.v1\neffect-count:1:1\neffect.0.family:19:bootstrap_authority\neffect.0.result-slot:9:bootstrap\neffect.0.recorded-at-override:3:142\neffect.0.bootstrap-label:4:root\neffect.0.operation-authority:4:auth\n"
    expected: {errorClass: context-frame, field: trailing}
