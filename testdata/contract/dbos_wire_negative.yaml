    provenance: {source: boundary, ref: "canonical mutation consumes exact bytes"}
    mutation: {description: "Trailing mutation bytes fail closed.", operator: trailing-mutation-field}
    input: {schema: provenance.dbos-apply-input, contextHex: *context, mutation: "version:22:provenance.mutation.v1\neffect-count:1:1\neffect.0.family:19:bootstrap_authority\neffect.0.result-slot:9:bootstrap\neffect.0.recorded-at-override:3:142\neffect.0.bootstrap-label:4:root\neffect.0.operation-authority:4:auth\nx"}
