name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches go.mod's `go 1.25.0` directive plus one newer minor, same
        # spread pasture's own CI carries.
        go-version: ["1.25", "1.26"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: gofmt check
        # No allowlist: every tracked file must already be gofmt-clean. The
        # 5 files that failed this at the time this workflow was authored
        # were fixed in a preceding mechanical commit — see git log.
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need formatting (run: gofmt -w <file>):"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Set up Node (for ast-grep CLI)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26"
      - name: Install ast-grep
        # The ast-grep rule meta-gate (a Go test) execs the ast-grep binary,
        # so the test jobs need it on PATH, pinned to the same version the
        # nix dev shell resolves.
        run: npm install -g @ast-grep/cli@0.41.1
      - name: Test
        # Non-race pass. The race-instrumented pass runs separately in the
        # "Race Tests" job so a race failure and a plain logic failure are
        # never conflated in the same job's output.
        run: go test -count=1 -shuffle=on -timeout=15m ./...

  race:
    name: Race Tests
    runs-on: ubuntu-latest
    # The full race suite is CPU-heavy (SQLite + DBOS durable-execution
    # journal tests) and takes on the order of 10 minutes on ubuntu-latest
    # runners; this ceiling only guards against a genuine hang.
    timeout-minutes: 30
    # OFF BY DEFAULT (decided 2026-10-01). The full race suite is sleep-bound
    # (~600s+ in CI), and running it alongside the non-race build job ran the
    # whole suite TWICE per push. CI now runs the suite exactly ONCE, without
    # -race; this job is kept for on-demand use only (Actions -> CI -> Run
    # workflow). Re-enable it on pushes or PRs when the test-performance
    # overhaul lands:
    # https://github.com/dayvidpham/provenance/issues/27
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Set up Node (for ast-grep CLI)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26"
      - name: Install ast-grep
        # The ast-grep rule meta-gate (a Go test) execs the ast-grep binary,
        # so the test jobs need it on PATH, pinned to the same version the
        # nix dev shell resolves.
        run: npm install -g @ast-grep/cli@0.41.1
      - name: Race detector
        # KNOWN FLAKES (documented, load-sensitive under CI contention — do
        # NOT retry or skip; a red run here should be triaged against these
        # named families before being treated as a new regression):
        #   - apply-context deadline arm (governed_allocation_* deadline tests)
        #   - fused decode (governed_allocation_fused* tests)
        #   - tampering test (journal_spine_corruption_test.go family)
        env:
          CGO_ENABLED: "1"
        # -timeout matches the Makefile race target's discipline: Go's default
        # 10m test timeout is shorter than the full race suite on a two-core
        # runner (the root package alone runs ~6-7 min on a fast machine).
        run: go test -race -count=1 -shuffle=on -timeout=25m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node (for ast-grep CLI)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "26"

      - name: Install ast-grep
        # Pinned to the exact version the flake.nix dev shell currently
        # resolves (`ast-grep --version` inside `nix develop`), so a local
        # `make lint` and this CI step scan with the same engine.
        run: npm install -g @ast-grep/cli@0.41.1

      - name: ast-grep scan
        run: ast-grep scan --config sgconfig.yml --globs '!vendor/**' --globs '!worktree/**' .

  consumer-oracle:
    # The store-layer gate that used to live only in the consumer.
    #
    # Provenance v0.6.1 shipped a hole where the schema-currency fast path
    # stopped running activation's convergence checks, so a structurally-current
    # store carrying projection damage OPENED SUCCESSFULLY instead of being
    # refused. This repo's CI was green throughout; what caught it was Pasture's
    # cmd/pasture reader suite, whose
    # TestReaderIntegrityRowsAreHandlerOnlyBecauseTheStoreRefusesTheDamage
    # requires the open-time replay convergence check to refuse the damage
    # before any gate read runs.
    #
    # This job runs that consumer oracle, unchanged, against the revision under
    # test. It is a real cross-repo check: Pasture's fixture recipe, Pasture's
    # assertions, Pasture's production open path. See
    # .github/consumer-oracle/run.sh for the pin, the single documented
    # compatibility adaptation, and what this gate cannot catch.
    #
    # Cost: a shallow fetch of the pinned consumer plus a cold build of
    # cmd/pasture's test binary (whose TestMain also builds the CLI). Measured
    # here: ~15 s warm-cached and ~30 s cold-cache on a many-core workstation,
    # so budget roughly 1-3 min cold on a 2-vCPU runner. The module and build
    # caches are restored below, and this job runs alongside build/race/lint
    # rather than ahead of them. The timeout only guards against a hang.
    name: Consumer Oracle (pinned Pasture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
          # The consumer's module and build caches land in the same directories,
          # so this cache covers them too. Keying on go.sum and on the runner
          # script (which owns the consumer pin) means a pin bump re-downloads
          # deliberately instead of reusing a cache saved for another revision.
          cache-dependency-path: |
            go.sum
            .github/consumer-oracle/run.sh

      # The consumer test binary needs a C toolchain (runtime/cgo is in the
      # build graph of Pasture's SQLite stack). ubuntu-latest already ships gcc;
      # this makes that dependency explicit rather than incidental.
      - name: Verify the C toolchain the consumer build needs
        run: gcc --version

      - name: Run the pinned Pasture reader oracle against this checkout
        run: bash .github/consumer-oracle/run.sh

# `nix flake check` (which additionally builds the package derivation and
# runs the same gates through the pinned nixpkgs toolchain) is intentionally
# NOT wired into CI yet — it stays a local/manual gate until a nix job is
# added in a follow-up.
