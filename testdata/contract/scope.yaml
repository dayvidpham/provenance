# Executable-scope partition for the adversarial proof corpus.
#
# The relational contract's proof corpus (docs/journal-relational-contract.md
# and the sibling *.yaml files) spans the whole journal architecture.
#
# This table maps every corpus operator to its enduring behavior area. The
# corpus harness executes every area against production code and fails if an
# operator is missing, stale, or has no handler.
#
# Behavior areas:
#   journal-foundation — ordered journal, task events, projections, namespaces
#   operation-lifecycle — operations, effects, authority, results, assignments
#   recovery-and-migration — replay, recovery, convergence, migration, preflight
operators:
  # --- journal foundation ----------------------------------------------------
  - {operator: order-by-journalid,                          area: journal-foundation}
  - {operator: order-by-journalid-concurrent,               area: journal-foundation}
  - {operator: order-by-recordedat-timeline,                area: journal-foundation, reason: readable-timeline display order (§12)}
  - {operator: reject-non-journalid-order-request,          area: journal-foundation}
  - {operator: claim-two-disjoint-namespaces,               area: journal-foundation}
  - {operator: claim-overlapping-namespace,                 area: journal-foundation}
  - {operator: register-manifest-entry-out-of-range,        area: journal-foundation}
  - {operator: write-journal-row-missing-subtype,           area: journal-foundation}

  # --- operation lifecycle ---------------------------------------------------
  - {operator: authorize-using-recordedat-not-journalid,    area: operation-lifecycle, reason: authority ordering}
  - {operator: apply-empty-batch,                           area: operation-lifecycle, reason: operation anchoring}
  - {operator: apply-zero-task-event-operation,             area: operation-lifecycle, reason: operation anchoring}
  - {operator: authority-precedence-by-journalid,           area: operation-lifecycle, reason: authority}
  - {operator: lookup-committed,                            area: operation-lifecycle, reason: operation result lookup}
  - {operator: apply-genesis-operation,                     area: operation-lifecycle, reason: genesis operation/authority}
  - {operator: apply-genesis-retry-same-operationid,        area: operation-lifecycle, reason: genesis idempotency}
  - {operator: apply-genesis-with-extra-effect,             area: operation-lifecycle, reason: genesis sole-effect rule}
  - {operator: apply-null-authority-after-genesis,          area: operation-lifecycle, reason: null-authority discipline}
  - {operator: apply-second-genesis,                        area: operation-lifecycle, reason: genesis first-operation-only}
  - {operator: lookup-committed-emitted-events-from-closure, area: operation-lifecycle, reason: produced-row closure}
  - {operator: lookup-committed-reconstruct-result-slots,   area: operation-lifecycle, reason: result-slot reconstruction}
  - {operator: reject-result-slot-referencing-foreign-operation, area: operation-lifecycle, reason: result-slot own-operation integrity (rule 9)}
  - {operator: blocked-by-scheduling-edge-does-not-grant-authority, area: operation-lifecycle, reason: authority}
  - {operator: authority-unrelated,                         area: operation-lifecycle, reason: authority}
  - {operator: transitive-parent-citation-grants-authority, area: operation-lifecycle, reason: parent-citation governance (§14.5)}
  - {operator: parent-chain-middle-episode-ended-cuts-authority, area: operation-lifecycle, reason: parent-citation whole-chain liveness (§14.5)}
  - {operator: parent-chain-middle-ended-same-operation-cuts-authority, area: operation-lifecycle, reason: "parent-citation whole-chain liveness within one operation's per-effect fold (§9.3.1 / §14.5)"}
  - {operator: citation-of-inactive-parent-at-start-rejected, area: operation-lifecycle, reason: parent-citation validity at start (§14.5)}
  - {operator: corrupted-cyclic-parent-chain-fails-closed,  area: operation-lifecycle, reason: parent-citation bounded fail-closed walk (§14.5)}
  - {operator: batch-ended-before-started,                  area: operation-lifecycle, reason: assignment lifecycle order}
  - {operator: end-episode-never-started,                   area: operation-lifecycle, reason: assignment lifecycle order}
  - {operator: fold-sequentially-check-effect2-sees-effect1, area: operation-lifecycle, reason: per-effect authorization}
  - {operator: produce-subordinate-row-carrying-actor,      area: operation-lifecycle, reason: anchor-only actor placement (§10 rule 5)}
  - {operator: start-with-orphaned-predecessor,             area: operation-lifecycle, reason: orphaned-evidence rejection}
  - {operator: two-successors-same-predecessor,             area: operation-lifecycle, reason: single-consumption evidence}
  - {operator: attribute-episode-occupant-not-committer,    area: operation-lifecycle, reason: assignment-episode attribution}
  - {operator: close-task-omit-ended-transition,            area: operation-lifecycle, reason: assignment lifecycle}
  - {operator: close-task-with-active-assignment,           area: operation-lifecycle, reason: assignment lifecycle}
  - {operator: concurrent-transfer-cas,                     area: operation-lifecycle, reason: transfer CAS}
  - {operator: write-journal-row-two-subtypes,              area: operation-lifecycle, reason: needs decision/evidence subtype tables}
  - {operator: write-subtype-mismatching-journalkind,       area: operation-lifecycle, reason: needs operations subtype table}
  - {operator: write-authority-detail-mismatching-authoritykind, area: operation-lifecycle, reason: needs authority subtype tables}

  # --- recovery and migration ------------------------------------------------
  - {operator: replay-with-ended-authority,                 area: recovery-and-migration, reason: Open-time replay}
  - {operator: replay-zero-task-event-operation,            area: recovery-and-migration, reason: Open-time replay}
  - {operator: apply-then-close-then-reopen-compare-projection, area: recovery-and-migration, reason: Apply/Open convergence}
  - {operator: cancel-mid-batch,                            area: recovery-and-migration, reason: cancellation recovery}
  - {operator: concurrent-open-then-reopen-converge,        area: recovery-and-migration, reason: replay convergence}
  - {operator: fault-then-retry-same-operation,             area: recovery-and-migration, reason: failure recovery}
  - {operator: reuse-operationid-different-mutation-digest, area: recovery-and-migration, reason: idempotent replay short-circuit}
  - {operator: fault-between-transfer-ended-and-started,    area: recovery-and-migration, reason: transfer-crash atomicity}
  - {operator: reopen-task,                                 area: recovery-and-migration, reason: reopen recovery}
  - {operator: migrate-legacy-task,                         area: recovery-and-migration, reason: legacy baseline migration}
  - {operator: migrate-legacy-task-with-fabricated-timestamp, area: recovery-and-migration, reason: honest-timestamp migration}
