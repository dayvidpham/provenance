  - {operator: migrate-then-extend-compare-to-native-only,  area: recovery-and-migration, reason: migrated/native equivalence}
  - {operator: migrate-then-remigrate-same-legacy-set,      area: recovery-and-migration, reason: idempotent re-migration}
  - {operator: migrate-two-identical-createdat-tie-break,   area: recovery-and-migration, reason: "deterministic created_at/id sort totality"}
  - {operator: schema-preflight,                            area: recovery-and-migration, reason: external-schema preflight}
  - {operator: schema-preflight-extra-column,               area: recovery-and-migration, reason: external-schema preflight}
  - {operator: schema-preflight-extra-table,                area: recovery-and-migration, reason: external-schema preflight extra-table direction}
  - {operator: schema-preflight-missing-column,             area: recovery-and-migration, reason: external-schema preflight}
  - {operator: schema-preflight-missing-table,              area: recovery-and-migration, reason: external-schema preflight}
  - {operator: fault-mid-migration,                         area: recovery-and-migration, reason: migration fail-closed}
  - {operator: concurrent-open-during-corruption,           area: recovery-and-migration, reason: fail-closed topology detection}
  - {operator: replay-converges-clean,                      area: recovery-and-migration, reason: §15 from-empty convergence}
  - {operator: replay-converges-migrated-status,            area: recovery-and-migration, reason: §15 migrated-status reproducibility}
  - {operator: replay-detects-out-of-band-corruption,       area: recovery-and-migration, reason: §15 fail-closed divergence detection}
  - {operator: verify-clean-spine,                          area: recovery-and-migration, reason: "corrupted-spine family — non-vacuous control"}
  - {operator: corrupt-delete-subtype-row,                  area: recovery-and-migration, reason: "corrupted-spine family — subtype-totality fail-closed"}
  - {operator: corrupt-rewrite-discriminator,               area: recovery-and-migration, reason: "corrupted-spine family — discriminator-agreement fail-closed"}
  - {operator: corrupt-truncate-tail,                       area: recovery-and-migration, reason: "corrupted-spine family — truncated-tail convergence fail-closed"}
  - {operator: corrupt-noncontiguous-insert,                area: recovery-and-migration, reason: "corrupted-spine family — bare-supertype-insert totality fail-closed"}
  - {operator: revoke-then-pinned-retry-uncommitted,        area: recovery-and-migration, reason: "authority-revocation family — pinned retry under revoked authority"}
  - {operator: revoke-then-exact-replay-committed,          area: recovery-and-migration, reason: "authority-revocation family — committed exact replay short-circuits"}
  - {operator: fsm-rejects-closed-to-in-progress,          area: recovery-and-migration, reason: "§8.1 status FSM — illegal closed→in_progress transition fails closed"}
  - {operator: fsm-stopped-transition-converges,           area: recovery-and-migration, reason: "§8.1 status FSM — in_progress→open stopped transition + from-empty convergence"}
  - {operator: fsm-forced-coercion-converges,              area: recovery-and-migration, reason: "§8.1/§16 forced FSM escape hatch — journal-reproducible, audit-visible coercion"}
  - {operator: mutation-family-who-provenance,             area: recovery-and-migration, reason: "§6 amendment — edge/label/comment journaled who-provenance (committer, authority, position, operands)"}
  - {operator: mutation-family-unauthorized-rejected,      area: recovery-and-migration, reason: "§6/§9.3 — edge/label/comment mutations obey per-effect authorization (must-fail per family)"}
  - {operator: mutation-family-projections-replay,         area: recovery-and-migration, reason: "§6/§15 — edge/label/comment domain projections re-derive from empty and converge"}
  - {operator: journaled-edge-grants-no-authority,         area: recovery-and-migration, reason: "§14.5 re-pin — journaled blocked_by edge still delegates no ownership authority"}
  - {operator: mutation-family-comment-body-corruption-detected, area: recovery-and-migration, reason: "§6.4/§15 — full-tuple domain-projection convergence detects out-of-band comment-body corruption a key-only check missed"}
